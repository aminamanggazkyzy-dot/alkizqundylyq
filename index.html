<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Планировщик школьных мероприятий</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        @media print {
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            body {
                background-color: #ffffff;
                color: #000000;
            }
            .page-break {
                page-break-after: always;
            }
            .card-shadow {
                box-shadow: none !important;
                border: 1px solid #e2e8f0 !important;
            }
        }
        .modal {
            transition: opacity 0.25s ease;
        }
        /* Custom scrollbar for tables */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-indigo-700 text-white shadow-md no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-center space-x-3">
                    <div class="p-2.5 bg-white/10 rounded-xl backdrop-blur-sm">
                        <i class="fa-solid me-0 fa-calendar-check text-2xl text-indigo-200"></i>
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Школьный Планировщик</h1>
                        <p class="text-xs text-indigo-200">Годовой план и ценности недели</p>
                    </div>
                </div>

                <!-- Action Controls -->
                <div class="flex flex-wrap items-center gap-2">
                    <button onclick="openModal('eventModal')" class="bg-emerald-500 hover:bg-emerald-600 text-white font-medium px-4 py-2 rounded-lg transition-all shadow-sm flex items-center gap-2 text-sm">
                        <i class="fa-solid fa-plus"></i>
                        <span>Добавить мероприятие</span>
                    </button>
                    <button onclick="openModal('staffModal')" class="bg-white/10 hover:bg-white/20 text-white font-medium px-3 py-2 rounded-lg transition-all text-sm flex items-center gap-2">
                        <i class="fa-solid fa-users-gear"></i>
                        <span class="hidden sm:inline">Ответственные</span>
                    </button>
                    <button onclick="window.print()" class="bg-white/10 hover:bg-white/20 text-white font-medium px-3 py-2 rounded-lg transition-all text-sm flex items-center gap-2" title="Печать / Сохранить в PDF">
                        <i class="fa-solid fa-print"></i>
                        <span class="hidden sm:inline">Печать</span>
                    </button>
                    
                    <!-- Backup dropdown / buttons -->
                    <div class="flex items-center space-x-1 bg-white/10 p-1 rounded-lg">
                        <button onclick="exportData()" class="text-white hover:bg-white/20 p-1.5 rounded transition-all text-sm" title="Экспорт данных (JSON)">
                            <i class="fa-solid fa-download"></i>
                        </button>
                        <label class="text-white hover:bg-white/20 p-1.5 rounded transition-all text-sm cursor-pointer" title="Импорт данных (JSON)">
                            <i class="fa-solid fa-upload"></i>
                            <input type="file" id="importFile" onchange="importData(event)" class="hidden" accept=".json">
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full">

        <!-- Print Header (Visible only when printing) -->
        <div class="hidden print-only mb-6 text-center border-b pb-4">
            <h1 class="text-2xl font-bold text-slate-900">План мероприятий школы</h1>
            <p id="printMonthTitle" class="text-lg text-slate-700 font-semibold mt-1"></p>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mb-6">
            <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
                
                <!-- Month Switcher -->
                <div class="flex items-center space-x-2 overflow-x-auto pb-2 lg:pb-0 no-print">
                    <button onclick="changeMonth(-1)" class="p-2 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 transition-all flex-shrink-0">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <select id="monthSelect" onchange="onMonthSelectChange()" class="bg-slate-50 border border-slate-300 text-slate-900 text-base rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2.5 font-semibold">
                        <!-- Filled dynamically -->
                    </select>
                    <button onclick="changeMonth(1)" class="p-2 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 transition-all flex-shrink-0">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>

                <!-- Theme / Title of the Month -->
                <div class="flex-grow max-w-2xl">
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider">Тема / Название месяца:</label>
                        <button onclick="editMonthTheme()" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium no-print flex items-center gap-1">
                            <i class="fa-solid fa-pen"></i> Изменить
                        </button>
                    </div>
                    <div id="monthThemeDisplay" class="text-lg font-bold text-slate-800 bg-indigo-50/50 px-3 py-1.5 rounded-lg border border-indigo-100/60">
                        <!-- Theme string here -->
                    </div>
                </div>

                <!-- Quick Filter / Info -->
                <div class="flex items-center gap-4 text-sm text-slate-500 no-print border-t lg:border-t-0 pt-3 lg:pt-0 border-slate-100">
                    <div>
                        Всего событий: <span id="totalEventsCount" class="font-bold text-slate-800">0</span>
                    </div>
                </div>

            </div>
        </div>

        <div id="weeksContainer" class="space-y-6">
            <!-- Dynamically populated week cards -->
        </div>

    </main>

    <footer class="bg-slate-100 border-t border-slate-200 mt-12 py-4 text-center text-xs text-slate-500 no-print">
        <p>Школьная система планирования мероприятий &bull; Все данные хранятся локально в вашем браузере</p>
    </footer>

    <div id="eventModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-100 max-w-lg w-full overflow-hidden transform transition-all">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 id="eventModalTitle" class="text-lg font-bold text-slate-800">Новое мероприятие</h3>
                <button onclick="closeModal('eventModal')" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <form id="eventForm" onsubmit="handleEventSubmit(event)" class="p-6 space-y-4">
                <input type="hidden" id="eventId">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Название мероприятия *</label>
                    <input type="text" id="eventTitle" required placeholder="Например: Осенний бал / Педсовет" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Месяц *</label>
                        <select id="eventMonthSelect" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <!-- Filled dynamically -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Дата *</label>
                        <input type="date" id="eventDate" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Время (необязательно)</label>
                        <input type="time" id="eventTime" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Ответственный</label>
                        <select id="eventStaffSelect" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <!-- Filled dynamically -->
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Дополнительная информация</label>
                    <textarea id="eventInfo" rows="3" placeholder="Классы, инвентарь, кабинет, ссылки и примечания..." class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                </div>

                <div class="flex justify-end space-x-3 pt-3 border-t border-slate-100">
                    <button type="button" onclick="closeModal('eventModal')" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">Отмена</button>
                    <button type="submit" class="px-5 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm transition-colors">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <div id="staffModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-100 max-w-md w-full overflow-hidden transform transition-all">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 class="text-lg font-bold text-slate-800">Список ответственных</h3>
                <button onclick="closeModal('staffModal')" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div class="flex gap-2">
                    <input type="text" id="newStaffName" placeholder="ФИО учителя / Должность" class="flex-grow border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <button onclick="addStaffMember()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition-colors">
                        Добавить
                    </button>
                </div>

                <div class="border border-slate-200 rounded-lg max-h-60 overflow-y-auto divide-y divide-slate-100" id="staffListContainer">
                    <!-- Staff list items -->
                </div>
            </div>
        </div>
    </div>

    <div id="editThemeModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-100 max-w-md w-full overflow-hidden transform transition-all">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 id="editThemeTitle" class="text-lg font-bold text-slate-800">Редактирование</h3>
                <button onclick="closeModal('editThemeModal')" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="editThemeType"> <!-- 'month' or 'week' -->
                <input type="hidden" id="editThemeWeekIndex"> 
                <div>
                    <label id="editThemeLabel" class="block text-xs font-semibold text-slate-600 mb-1">Значение</label>
                    <input type="text" id="editThemeInput" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="closeModal('editThemeModal')" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">Отмена</button>
                    <button type="button" onclick="saveThemeChange()" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Default months structure
        const MONTH_NAMES = [
            "Сентябрь", "Октябрь", "Ноябрь", "Декабрь", 
            "Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август"
        ];

        // Core Application State
        let appData = {
            currentMonthIndex: 0, // Default to September
            staff: [
                "Иванова А. П. (Зам. по ВР)",
                "Петров С. В. (Учитель физкультуры)",
                "Сидорова Е. Н. (Организатор)",
                "Смирнов К. Д. (Педагог-психолог)"
            ],
            // Store month themes/names and week values
            monthConfigs: {},
            events: []
        };

        // Initialize App on DOM Load
        window.onload = function () {
            loadFromLocalStorage();
            initializeMonthConfigs();
            renderMonthDropdowns();
            renderApp();
        };

        function initializeMonthConfigs() {
            MONTH_NAMES.forEach((m, idx) => {
                if (!appData.monthConfigs[idx]) {
                    appData.monthConfigs[idx] = {
                        theme: `Месячник воспитательной работы (${m})`,
                        weeks: [
                            "Честность и уважение",
                            "Трудолюбие и ответственность",
                            "Знания и патриотизм",
                            "Культура и единство",
                            "Творчество и спорт"
                        ]
                    };
                }
            });
        }

        function saveToLocalStorage() {
            localStorage.setItem('school_event_planner_data', JSON.stringify(appData));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('school_event_planner_data');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    appData = { ...appData, ...parsed };
                } catch (e) {
                    console.error("Ошибка при загрузке сохраненных данных", e);
                }
            }
        }

        function renderMonthDropdowns() {
            const monthSelect = document.getElementById('monthSelect');
            const eventMonthSelect = document.getElementById('eventMonthSelect');

            monthSelect.innerHTML = '';
            eventMonthSelect.innerHTML = '';

            MONTH_NAMES.forEach((m, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = m;
                if (idx === appData.currentMonthIndex) opt.selected = true;
                monthSelect.appendChild(opt);

                const opt2 = document.createElement('option');
                opt2.value = idx;
                opt2.textContent = m;
                eventMonthSelect.appendChild(opt2);
            });
        }

        function renderStaffOptions() {
            const select = document.getElementById('eventStaffSelect');
            select.innerHTML = '<option value="">-- Не выбрано --</option>';
            appData.staff.forEach(person => {
                const opt = document.createElement('option');
                opt.value = person;
                opt.textContent = person;
                select.appendChild(opt);
            });

            // Also render management list
            const container = document.getElementById('staffListContainer');
            if (appData.staff.length === 0) {
                container.innerHTML = '<div class="p-3 text-xs text-slate-400 text-center">Список пуст</div>';
                return;
            }

            container.innerHTML = appData.staff.map((person, index) => `
                <div class="flex items-center justify-between p-2.5 hover:bg-slate-50 transition-colors">
                    <span class="text-sm font-medium text-slate-700">${person}</span>
                    <button onclick="removeStaffMember(${index})" class="text-rose-500 hover:text-rose-700 p-1 rounded">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                </div>
            `).join('');
        }

        function onMonthSelectChange() {
            const select = document.getElementById('monthSelect');
            appData.currentMonthIndex = parseInt(select.value);
            saveToLocalStorage();
            renderApp();
        }

        function changeMonth(delta) {
            let newIndex = appData.currentMonthIndex + delta;
            if (newIndex < 0) newIndex = 11;
            if (newIndex > 11) newIndex = 0;
            appData.currentMonthIndex = newIndex;
            document.getElementById('monthSelect').value = newIndex;
            saveToLocalStorage();
            renderApp();
        }

        function renderApp() {
            const currentIdx = appData.currentMonthIndex;
            const monthConfig = appData.monthConfigs[currentIdx];

            // Display Month Theme
            document.getElementById('monthThemeDisplay').textContent = monthConfig.theme || "Тема не задана";
            document.getElementById('printMonthTitle').textContent = `${MONTH_NAMES[currentIdx]} — ${monthConfig.theme}`;

            // Filter events for current month
            const monthEvents = appData.events.filter(e => parseInt(e.month) === currentIdx);
            document.getElementById('totalEventsCount').textContent = monthEvents.length;

            // Group events into 5 weeks based on Day of the Month
            // Week 1: Days 1-7, Week 2: 8-14, Week 3: 15-21, Week 4: 22-28, Week 5: 29-31
            const weeksEvents = [[], [], [], [], []];

            monthEvents.forEach(event => {
                if (!event.date) return;
                const day = new Date(event.date).getDate();
                let weekIdx = 0;

                if (day <= 7) weekIdx = 0;
                else if (day <= 14) weekIdx = 1;
                else if (day <= 21) weekIdx = 2;
                else if (day <= 28) weekIdx = 3;
                else weekIdx = 4;

                weeksEvents[weekIdx].push(event);
            });

            // Render each week card
            const weeksContainer = document.getElementById('weeksContainer');
            weeksContainer.innerHTML = '';

            const weekHeaders = ["1-я неделя", "2-я неделя", "3-я неделя", "4-я неделя", "5-я неделя"];

            weekHeaders.forEach((weekLabel, wIdx) => {
                const weekValue = monthConfig.weeks[wIdx] || "Ценность не указана";
                const eventsList = weeksEvents[wIdx];

                // Sort events chronologically inside week
                eventsList.sort((a, b) => {
                    const timeA = a.time || '00:00';
                    const timeB = b.time || '00:00';
                    return (a.date + timeA).localeCompare(b.date + timeB);
                });

                const weekCard = document.createElement('div');
                weekCard.className = "bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden card-shadow";

                weekCard.innerHTML = `
                    <!-- Week Header -->
                    <div class="bg-slate-50 border-b border-slate-200/80 px-5 py-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div class="flex items-center space-x-3">
                            <span class="px-2.5 py-1 bg-indigo-100 text-indigo-700 text-xs font-bold rounded-md uppercase tracking-wider">${weekLabel}</span>
                            <div class="flex items-center space-x-1.5">
                                <span class="text-xs text-slate-400 font-semibold uppercase">Ценность:</span>
                                <span class="text-sm font-semibold text-slate-800">${escapeHtml(weekValue)}</span>
                            </div>
                        </div>
                        <button onclick="editWeekValue(${wIdx})" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium self-start sm:self-center no-print flex items-center gap-1">
                            <i class="fa-solid fa-pen"></i> Редактировать ценность
                        </button>
                    </div>

                    <!-- Events List / Table -->
                    <div class="p-4">
                        ${eventsList.length === 0 ? `
                            <div class="text-center py-6 text-slate-400 text-sm italic">
                                Нет запланированных мероприятий на этой неделе
                            </div>
                        ` : `
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="text-xs font-semibold text-slate-400 uppercase border-b border-slate-100 pb-2">
                                            <th class="py-2 px-3 w-32">Дата и Время</th>
                                            <th class="py-2 px-3">Мероприятие</th>
                                            <th class="py-2 px-3 w-48">Ответственный</th>
                                            <th class="py-2 px-3 w-64">Доп. информация</th>
                                            <th class="py-2 px-3 text-right w-24 no-print">Действия</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100 text-sm">
                                        ${eventsList.map(ev => renderEventRow(ev)).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `}
                    </div>
                `;

                weeksContainer.appendChild(weekCard);
            });
        }

        function renderEventRow(ev) {
            const formattedDate = formatDate(ev.date);
            return `
                <tr class="hover:bg-slate-50/80 transition-colors">
                    <td class="py-3 px-3 align-top">
                        <div class="font-semibold text-slate-800">${formattedDate}</div>
                        ${ev.time ? `<div class="text-xs text-indigo-600 font-medium mt-0.5"><i class="fa-regular fa-clock me-1"></i>${ev.time}</div>` : ''}
                    </td>
                    <td class="py-3 px-3 align-top">
                        <div class="font-bold text-slate-900">${escapeHtml(ev.title)}</div>
                    </td>
                    <td class="py-3 px-3 align-top">
                        ${ev.staff ? `<span class="inline-flex items-center gap-1 text-xs font-medium text-slate-700 bg-slate-100 px-2 py-1 rounded-md"><i class="fa-solid fa-user text-slate-400 text-[10px]"></i>${escapeHtml(ev.staff)}</span>` : '<span class="text-slate-400 italic text-xs">—</span>'}
                    </td>
                    <td class="py-3 px-3 align-top text-slate-600 text-xs leading-relaxed whitespace-pre-line">
                        ${ev.info ? escapeHtml(ev.info) : '<span class="text-slate-300">—</span>'}
                    </td>
                    <td class="py-3 px-3 align-top text-right no-print">
                        <div class="flex items-center justify-end space-x-2">
                            <button onclick="editEvent('${ev.id}')" class="text-slate-400 hover:text-indigo-600 p-1 rounded transition-colors" title="Редактировать">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button onclick="deleteEvent('${ev.id}')" class="text-slate-400 hover:text-rose-600 p-1 rounded transition-colors" title="Удалить">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        }

        function handleEventSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('eventId').value;
            const title = document.getElementById('eventTitle').value.trim();
            const month = document.getElementById('eventMonthSelect').value;
            const date = document.getElementById('eventDate').value;
            const time = document.getElementById('eventTime').value;
            const staff = document.getElementById('eventStaffSelect').value;
            const info = document.getElementById('eventInfo').value.trim();

            if (!title || !date) return;

            if (id) {
                // Update existing
                const idx = appData.events.findIndex(item => item.id === id);
                if (idx !== -1) {
                    appData.events[idx] = { id, title, month, date, time, staff, info };
                }
            } else {
                // Create new
                const newEvent = {
                    id: Date.now().toString(),
                    title,
                    month,
                    date,
                    time,
                    staff,
                    info
                };
                appData.events.push(newEvent);
            }

            // Sync current view month with event month
            appData.currentMonthIndex = parseInt(month);
            document.getElementById('monthSelect').value = month;

            saveToLocalStorage();
            renderApp();
            closeModal('eventModal');
        }

        function editEvent(id) {
            const ev = appData.events.find(item => item.id === id);
            if (!ev) return;

            document.getElementById('eventId').value = ev.id;
            document.getElementById('eventTitle').value = ev.title;
            document.getElementById('eventMonthSelect').value = ev.month;
            document.getElementById('eventDate').value = ev.date;
            document.getElementById('eventTime').value = ev.time || '';
            document.getElementById('eventStaffSelect').value = ev.staff || '';
            document.getElementById('eventInfo').value = ev.info || '';

            document.getElementById('eventModalTitle').textContent = "Редактировать мероприятие";
            openModal('eventModal');
        }

        function deleteEvent(id) {
            if (confirm("Вы уверены, что хотите удалить это мероприятие?")) {
                appData.events = appData.events.filter(item => item.id !== id);
                saveToLocalStorage();
                renderApp();
            }
        }

        function addStaffMember() {
            const input = document.getElementById('newStaffName');
            const val = input.value.trim();
            if (val) {
                appData.staff.push(val);
                input.value = '';
                saveToLocalStorage();
                renderStaffOptions();
            }
        }

        function removeStaffMember(index) {
            appData.staff.splice(index, 1);
            saveToLocalStorage();
            renderStaffOptions();
        }

        function editMonthTheme() {
            const currentIdx = appData.currentMonthIndex;
            document.getElementById('editThemeType').value = 'month';
            document.getElementById('editThemeTitle').textContent = `Тема месяца: ${MONTH_NAMES[currentIdx]}`;
            document.getElementById('editThemeLabel').textContent = "Название или общая тема месяца";
            document.getElementById('editThemeInput').value = appData.monthConfigs[currentIdx].theme || '';
            openModal('editThemeModal');
        }

        function editWeekValue(weekIdx) {
            const currentIdx = appData.currentMonthIndex;
            document.getElementById('editThemeType').value = 'week';
            document.getElementById('editThemeWeekIndex').value = weekIdx;
            document.getElementById('editThemeTitle').textContent = `${weekIdx + 1}-я неделя месяца ${MONTH_NAMES[currentIdx]}`;
            document.getElementById('editThemeLabel').textContent = "Ценность или направление недели";
            document.getElementById('editThemeInput').value = appData.monthConfigs[currentIdx].weeks[weekIdx] || '';
            openModal('editThemeModal');
        }

        function saveThemeChange() {
            const type = document.getElementById('editThemeType').value;
            const val = document.getElementById('editThemeInput').value.trim();
            const currentIdx = appData.currentMonthIndex;

            if (type === 'month') {
                appData.monthConfigs[currentIdx].theme = val;
            } else if (type === 'week') {
                const wIdx = parseInt(document.getElementById('editThemeWeekIndex').value);
                appData.monthConfigs[currentIdx].weeks[wIdx] = val;
            }

            saveToLocalStorage();
            renderApp();
            closeModal('editThemeModal');
        }

        function openModal(id) {
            if (id === 'eventModal' && !document.getElementById('eventId').value) {
                // If opening for NEW event, set default month & title
                document.getElementById('eventForm').reset();
                document.getElementById('eventId').value = '';
                document.getElementById('eventMonthSelect').value = appData.currentMonthIndex;
                document.getElementById('eventModalTitle').textContent = "Новое мероприятие";
            }
            renderStaffOptions();
            document.getElementById(id).classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `school_schedule_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const fileReader = new FileReader();
            fileReader.onload = function (e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported && imported.monthConfigs && imported.events) {
                        appData = imported;
                        saveToLocalStorage();
                        renderMonthDropdowns();
                        renderApp();
                        alert("Данные успешно импортированы!");
                    } else {
                        alert("Некорректный формат файла резервной копии.");
                    }
                } catch (err) {
                    alert("Ошибка при чтении файла!");
                }
            };
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0]);
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const [year, month, day] = dateStr.split('-');
            return `${day}.${month}.${year}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
